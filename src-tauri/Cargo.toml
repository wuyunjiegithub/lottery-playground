[package]
name = "lottery-playground"
version = "1.0.0"
description = "概率游乐场 · 双色球大乐透概率实验玩具（单机版）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lottery_playground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# charset 特性启用 encoding_rs，可直接按 GBK 解码 500.com 的早期数据
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 本地 SQLite：装开奖历史与回测汇总（合计约 2.6 MB）
# 用官方插件而非裸 rusqlite，省去手写连接管理与 IPC 命令
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
